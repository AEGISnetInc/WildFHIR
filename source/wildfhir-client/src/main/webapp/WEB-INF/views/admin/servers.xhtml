<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<!-- This is the view file for the Servers Tab -->
	<p:tab id="manageServers" title="Servers" cache="false">
		<h:form id="serversForm" prependId="false" style="width:100%;border:none;">
			<p:messages for="manageServers" id="manageServerMessages"
				showDetail="true" autoUpdate="true" closable="true" />
			<h:outputText value="Manage FHIR Servers"
				style="padding:0px;font-style:italic;font-weight:bold;font-size:14px;" />
		</h:form>

		<p:toolbar>
			<f:facet name="right">
				<p:commandButton value="Define Server" icon="ui-icon-document"
					onclick="PF('createServerPanel').show();" />
			</f:facet>
		</p:toolbar>
		<p:outputPanel id="serverDataTableWrapper">
			<p:dataTable var="server" rowIndexVar="position"
				value="#{context.availableServers}"
				rendered="#{context.availableServers.size() > 0}">
				<p:column headerText="Server Name">
					<h:outputText value="#{server.name}" />
				</p:column>
				<p:column headerText="Base URL">
					<h:outputText value="#{server.basepath}" />
				</p:column>
				<p:column headerText="Last Updated">
					<h:outputText value="#{server.lastupdate}" />
				</p:column>
				<p:column headerText="OAuth Type">
					<h:outputText value="#{server.oauthgranttype}" />
				</p:column>
				<p:column headerText="Actions">
					<h:form id="serverPreviewForm" prependId="false"
						style="width:100%;border:none;">
						<p:commandButton value="Delete" title="Delete Server"
							icon="ui-icon-trash"
							actionListener="#{controller.deleteServer(server)}"
							update=":tabView:adminTabView:serverDataTableWrapper,:tabView:adminTabView:serversForm"
							rendered="#{server.id > 1}" />
						<br />
						<p:commandButton value="Modify" title="Modify Server"
							icon="ui-icon-pencil"
							actionListener="#{controller.serverToManage(server)}"
							update=":tabView:adminTabView:manageServerForm"
							oncomplete="PF('manageServerPanel').show();"
							rendered="#{server.id > 1}">
							<f:param name="provider" value="#{provider}" />
						</p:commandButton>
					</h:form>
				</p:column>
			</p:dataTable>
		</p:outputPanel>

		<p:panel id="manageServerPanel" visible="false"
			widgetVar="manageServerPanel" toggleable="true" closable="true"
			toggleSpeed="500" closeSpeed="500">

			<h:form id="manageServerForm" prependId="false"
				style="width:100%;border:none;">
				<p>
					<p:commandLink id="closeUpdateExistingServer"
						value="Update Existing Server" 
						type="button"
						onclick="PF('manageServerPanel').close();" 
						style="padding:2px;text-decoration:underline;font-weight:bold;font-size:16px;" />

					<!-- Tooltip bound explicitly to the link ID above -->
					<p:tooltip id="closeUpdateExistingServerTooltip" 
						for="closeUpdateExistingServer" 
						value="Click to close this panel and hide the update existing server form." 
						position="top" 
						showDelay="300" />
				</p>
				<p:panelGrid id="manageServerGridPanel" layout="tabular" columns="2" border="0"
					cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">

					<h:outputText value="Name: " />
					<p:inputText id="selectedServerName"
						value="#{context.selectedServer.name}" required="true"
						label="Server Name"
						maxlength="255" size="60">
						<f:validateLength minimum="2" />
					</p:inputText>
					<h:outputText value="Description: " />
					<p:inputText id="selectedServerDescription"
						value="#{context.selectedServer.description}" required="true"
						label="Server Description"
						maxlength="255" size="60">
						<f:validateLength minimum="2" />
					</p:inputText>
					<h:outputText value="Base URL: " />
					<p:inputText id="selectedServerURL"
						value="#{context.selectedServer.basepath}" required="true"
						label="Server Base URL"
						maxlength="255" size="60">
						<f:validateLength minimum="10" />
						<f:validateRegex
							pattern="^(https?|ftp|file)://[-a-zA-Z0-9+&amp;@#/%?=~_|!:,.;]*[-a-zA-Z0-9+&amp;@#/%=~_|]" />
					</p:inputText>

					<h:outputText value="OAuth" style="padding:0px;font-weight:bold;font-size:12px;" />
					<h:outputText value="" />

					<h:outputText value="Grant Type: " />
					<p:selectOneMenu id="selectedServerOAuthgranttypeDropdown" required="false" label="Select OAuth Grant Type" value="#{context.selectedServer.oauthgranttype}" style="width:360px;text-align:left;padding-right:30px;">
						<f:selectItem itemValue="#{null}" itemLabel="-- Select OAuth Grant Type --         " noSelectionOption="true" />
						<f:selectItem itemValue="client_credentials" itemLabel="client_credentials" />
					</p:selectOneMenu>
					<h:outputText value="Client Id: " />
					<p:inputText id="selectedServerOAuthclientid"
						value="#{context.selectedServer.oauthclientid}" required="false"
						label="Client Id"
						maxlength="64" size="60">
					</p:inputText>
					<h:outputText value="Client Secret: " />
					<h:panelGroup layout="block" styleClass="custom-password-container">
						<p:password id="selectedServerOAuthclientsecret"
							value="#{context.selectedServer.oauthclientsecret}" required="false"
							promptLabel="Please enter your client secret" redisplay="true"
							toggleMask="true"
							maxlength="255" size="55"
							widgetVar="updateClientSecret">
							<!-- Our manually drawn, theme-proof button canvas -->
							<button type="button" class="custom-toggle-btn masked-state" onclick="PF('updateClientSecret').toggleMask(); toggleBtnIcon(this);"></button>
						</p:password>
					</h:panelGroup>
					<h:outputText value="Scopes: " />
					<h:inputTextarea id="selectedServerOAuthscope" value="#{context.selectedServer.oauthscope}" cols="50" rows="2" required="false" />
					<h:outputText value="Auth URL: " />
					<h:inputTextarea id="selectedServerOAuthauthurl" value="#{context.selectedServer.oauthauthurl}" cols="50" rows="2" required="false" />
					<h:outputText value="Token URL: " />
					<h:inputTextarea id="selectedServerOAuthtokenurl" value="#{context.selectedServer.oauthtokenurl}" cols="50" rows="2" required="false" />
					<h:outputText value="Introspect URL: " />
					<h:inputTextarea id="selectedServerOAuthintrospecturl" value="#{context.selectedServer.oauthintrospecturl}" cols="50" rows="2" required="false" />

					<h:outputText value="" />
					<p:commandButton value="Update Server"
						actionListener="#{controller.manageServer('existing')}"
						oncomplete="PF('manageServerPanel').close()"
						update=":tabView:adminTabView:serverDataTableWrapper,:tabView:adminTabView:manageServerMessages,:tabView:adminTabView:serversForm">
						<f:param name="updateExistingServer" value="true" />
					</p:commandButton>
				</p:panelGrid>
			</h:form>
		</p:panel>

		<p:panel id="createServerPanel" visible="false"
			widgetVar="createServerPanel" toggleable="true" closable="true"
			toggleSpeed="500" closeSpeed="500">

			<h:form id="createServerForm" prependId="false"
				style="width:100%;border:none;">
				<p:messages id="createServerFormMessages" />
				<p>
					<p:commandLink id="closeCreateNewServer"
						value="Create New Server" 
						type="button"
						onclick="PF('createServerPanel').close();" 
						style="padding:2px;text-decoration:underline;font-weight:bold;font-size:16px;" />

					<!-- Tooltip bound explicitly to the link ID above -->
					<p:tooltip id="closeCreateNewServerTooltip" 
						for="closeCreateNewServer" 
						value="Click to close this panel and hide the create new server form." 
						position="top" 
						showDelay="300" />
				</p>
				<p:panelGrid id="createServerGridPanel" layout="tabular" columns="2" border="0"
					cellpadding="5" cellspacing="10" styleClass="borderlessGridPanel">
					<h:outputText value="Name: " />
					<p:inputText id="newServerName"
						value="#{context.newServer.name}"
						required="true" label="Server Name"
						maxlength="255" size="60">
						<f:validateLength minimum="2" />
					</p:inputText>

					<h:outputText value="Description: " />
					<p:inputText id="newServerDescription"
						value="#{context.newServer.description}" required="true"
						label="Server Description"
						maxlength="255" size="60">
						<f:validateLength minimum="2" />
					</p:inputText>

					<h:outputText value="Base URL: " />
					<p:inputText id="newServerURL"
						value="#{context.newServer.basepath}" required="true"
						label="Server Base URL"
						maxlength="255" size="60">
						<f:validateLength minimum="10" />
						<f:validateRegex
							pattern="^(https?|ftp|file)://[-a-zA-Z0-9+&amp;@#/%?=~_|!:,.;]*[-a-zA-Z0-9+&amp;@#/%=~_|]" />
					</p:inputText>

					<h:outputText value="OAuth" style="padding:0px;font-weight:bold;font-size:12px;" />
					<h:outputText value="" />

					<h:outputText value="Grant Type: " />
					<p:selectOneMenu id="newServerOAuthgranttypeDropdown" required="false" label="Select OAuth Grant Type" value="#{context.newServer.oauthgranttype}" style="width:360px;text-align:left;padding-right:30px;">
						<f:selectItem itemValue="#{null}" itemLabel="-- Select OAuth Grant Type --         " noSelectionOption="true" />
						<f:selectItem itemValue="client_credentials" itemLabel="client_credentials" />
					</p:selectOneMenu>
					<h:outputText value="Client Id: " />
					<p:inputText id="newServerOAuthclientid"
						value="#{context.newServer.oauthclientid}" required="false"
						label="Client Id"
						maxlength="64" size="60">
					</p:inputText>
					<h:outputText value="Client Secret: " />
					<h:panelGroup layout="block" styleClass="custom-password-container">
						<p:password id="newServerOAuthclientsecret"
							value="#{context.newServer.oauthclientsecret}" required="false"
							promptLabel="Please enter your client secret" redisplay="true"
							toggleMask="true"
							maxlength="255" size="55"
							widgetVar="newClientSecret">
						</p:password>
							<!-- Our manually drawn, theme-proof button canvas -->
							<button type="button" class="custom-toggle-btn masked-state" onclick="PF('newClientSecret').toggleMask(); toggleBtnIcon(this);"></button>
					</h:panelGroup>
					<h:outputText value="Scopes: " />
					<h:inputTextarea id="newServerOAuthscope" value="#{context.newServer.oauthscope}" cols="50" rows="2" required="false" />
					<h:outputText value="Auth URL: " />
					<h:inputTextarea id="newServerOAuthauthurl" value="#{context.newServer.oauthauthurl}" cols="50" rows="2" required="false" />
					<h:outputText value="Token URL: " />
					<h:inputTextarea id="newServerOAuthtokenurl" value="#{context.newServer.oauthtokenurl}" cols="50" rows="2" required="false" />
					<h:outputText value="Introspect URL: " />
					<h:inputTextarea id="newServerOAuthintrospecturl" value="#{context.newServer.oauthintrospecturl}" cols="50" rows="2" required="false" />

					<h:outputText value="" />
					<p:commandButton value="Create Server"
						actionListener="#{controller.manageServer('new')}"
						oncomplete="((args.validationFailed) ? PF('createServerPanel').show() : PF('createServerPanel').close())"
						update=":tabView:adminTabView:serverDataTableWrapper,:tabView:adminTabView:serversForm" />
				</p:panelGrid>
			</h:form>
		</p:panel>

	</p:tab>
</ui:composition>
